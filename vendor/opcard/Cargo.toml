[package]
name = "opcard"
version = "1.8.0"
authors = ["Nitrokey GmbH <info@nitrokey.com>"]
edition = "2021"
description = "OpenPGP smart card implementation"
repository = "https://github.com/nitrokey/opcard-rs"
license = "LGPL-3.0-only"

[workspace]

[dependencies]
cbor-smol = { version = "0.5", features = ["heapless-bytes-v0-5"] }
heapless = "0.9"
heapless-bytes = { version = "0.5", features = ["heapless-0.9"] }
iso7816 = "0.2.0"
littlefs2-core = "0.1"
log = "0.4"
serde = { version = "1.0", default-features = false }
subtle = { version = "2.4.1", default-features = false }
trussed-chunked = "0.3.0"
# TODO: only set RSA features if RSA is enabled?
trussed-core = { version = "0.2", features = ["aes256-cbc", "brainpoolp256r1", "brainpoolp384r1", "brainpoolp512r1", "chacha8-poly1305", "crypto-client", "ed255", "filesystem-client", "p256", "p384", "p521", "rsa2048", "rsa3072", "rsa4096", "secp256k1", "shared-secret", "ui-client", "x255"] }
trussed-rsa-alloc = { version = "0.5", optional = true }
trussed-rsa-types = { version = "0.2", optional = true }
trussed-wrap-key-to-file = "0.3.0"
serde_repr = "0.1"
hex-literal = "0.4.1"
trussed-auth = "0.5"
admin-app = { version = "0.3", optional = true }

# optional dependencies
apdu-app = { version = "0.2", optional = true }
delog = { version = "0.1.7", optional = true }
trussed-staging = { version = "0.5", features = ["chunked", "wrap-key-to-file"], optional = true }
vpicc = { version = "0.1.0", optional = true }
cfg-if = "1.0.0"
bitflags = "2.5.0"
trussed = { version = "0.2", default-features = false, optional = true }
trussed-auth-backend = { version = "0.2", optional = true }
# S-724 (fapico2 vendor patch): software secp256k1 backend serving the
# always-allowed SECP256K1 generation/import gates — wired into the virt
# dispatch (the device path wires the same crate in the platform
# `OpcardDispatch`).
trussed-secp256k1 = { path = "../trussed-secp256k1", optional = true }
# US-944 (fapico2 vendor patch): software Brainpool backend serving the
# BrainpoolP256R1/BrainpoolP384R1 (+Prehashed) mechanisms — wired into the
# virt dispatch (the device path wires the same crate in the platform
# `OpcardDispatch`). BrainpoolP512R1 is NOT served — no bp512 crate exists
# (docs/tasks/known-gate-divergences.md).
trussed-brainpool = { path = "../trussed-brainpool", optional = true }

[features]
default = []
std = []
apdu-dispatch = ["dep:apdu-app"]
vpicc = ["std", "dep:vpicc", "virt"]
# US-962 (I2): `virt` no longer force-enables `secp256k1-backend` /
# `brainpool-backend` / the `rsa*` advertisement features. They used to be
# implicit, which is exactly the defect US-962 fixes: a build could drop the
# backend from the dispatch while the advertisement kept naming the
# algorithm, because the two sides were wired to *different* switches (opcard's
# own features here, the platform's in `platform/Cargo.toml`) and neither could
# see the other. Now every algorithm group has exactly one switch — the
# consuming crate's, `fapico2-openpgp`'s — which turns both sides on together.
#
# What `virt` still implies on its own: `trussed-rsa-alloc`, the software
# backend *implementation*, which stays inert until the `rsa` feature turns on
# the `Backend::Rsa` arm that calls it.
virt = ["std", "trussed/virt", "trussed-auth-backend", "trussed-rsa-alloc", "trussed-staging"]
secp256k1-backend = ["dep:trussed-secp256k1"]
brainpool-backend = ["dep:trussed-brainpool"]

rsa = ["trussed-rsa-types"]
rsa2048 = ["rsa"]
rsa2048-gen = ["rsa2048"]
rsa3072 = ["rsa2048"]
rsa3072-gen = ["rsa3072", "rsa2048-gen"]
rsa4096 = ["rsa3072"]
rsa4096-gen = ["rsa4096", "rsa3072-gen"]

dangerous-test-real-card = []

# used for delog
log-all = []
log-none = []
log-trace = []
log-info = []
log-debug = []
log-warn = []
log-error = []

[patch.crates-io]
p256-cortex-m4 = { git = "https://github.com/Nitrokey/p256-cortex-m4", tag = "v0.1.0-alpha.6-nitrokey-1" }

[package.metadata.docs.rs]
all-features = true

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2
