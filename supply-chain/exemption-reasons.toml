# US-1061 (RS-KEY-ADOPT Phase 7) — the stated reason for every cargo-vet
# exemption.
#
# WHY THIS FILE EXISTS AND NOT A FIELD IN supply-chain/config.toml
# ----------------------------------------------------------------
# cargo-vet's exemption schema HAS a `reason` field, and on cargo-vet 0.10.2
# `cargo vet fmt` SILENTLY DELETES it. Verified, not assumed:
#
#     $ printf '[[exemptions.aead]]\nversion = "0.5.2"\ncriteria = "safe-to-deploy"\nreason = "test"\n'
#       >> supply-chain/config.toml
#     $ cargo vet fmt
#     $ grep -A3 'exemptions.aead' supply-chain/config.toml
#     [[exemptions.aead]]
#     version = "0.5.2"
#     criteria = "safe-to-deploy"          <- reason gone
#
# So a reason stored there is a reason somebody's next `cargo vet fmt` erases,
# and a policy that lives in a field the tool reformatter drops is not a
# policy. The reasons live here, in a file we own, and
# `tests/scripts/check_supply_chain.py` is what pairs them with the
# exemptions.
#
# WHAT THE GATE ENFORCES (US-1061: "a gate fails if a new exemption is added
# without a stated reason")
#   * every [[exemptions.NAME]] in config.toml has an entry here;
#   * every entry here corresponds to a real exemption (no stale reasons);
#   * every entry in `bespoke_required` has a reason that is NOT the
#     boilerplate, because the crates that carry key material, parse attacker
#     -adjacent input, or are a known advisory do not get a sentence that
#     says only that they are unreviewed.
#
# THE HONEST HEADLINE, restated here because this is the file a reader opens
# ----------------------------------------------------------------------
# 312 exemptions. 62 crates carry a third-party audit (imported from eight
# peers: mozilla, embark-studios, google, zcash, bytecode-alliance, actix,
# fermyon, isrg, ariel-os). That is 16.5% of the 375 third-party crates cargo-
# vet sees — close to RS-Key's ~17%, and close to 100% would be a lie. Of the
# crates actually linked into the RP2350 image the audited fraction is 41 of
# 276 = 14.9%. None of the 312 has been read by a human on this project.
#
# A KNOWN GAP, stated rather than left to be discovered: cargo-vet audits by
# REGISTRY identity, so the two vendored, MODIFIED crypto crates —
# vendor/ed448-goldilocks and vendor/x448, added under [patch.crates-io] for
# no_std (S-701-5) — are outside its view entirely. They are in the shipped
# image, they differ from crates.io, and no tool in this pipeline has looked
# at them. `check_supply_chain.py` names them on every run so the gap stays
# visible instead of becoming an absence.

# Crates whose reason must be written by a human, not generated. Each one
# either carries key material, parses attacker-adjacent input, or is a
# known accepted advisory.
bespoke_required = [
  "atomic-polyfill@1.0.3",
  "bare-metal@0.2.5",
  "iso7816@0.2.0",
  "linked_list_allocator@0.10.6",
  "littlefs2-core@0.1.3",
  "littlefs2@0.8.1",
  "opcard@1.8.0",
  "paste@1.0.15",
  "rand@0.8.8",
  "rand_core@0.10.1",
  "rand_core@0.5.1",
  "rsa@0.9.10",
  "trussed-auth-backend@0.2.0",
  "trussed-auth@0.5.0",
  "trussed-chunked@0.3.0",
  "trussed-core@0.2.2",
  "trussed-rsa-alloc@0.5.0",
  "trussed-rsa-types@0.2.0",
  "trussed-staging@0.5.0",
  "trussed-wrap-key-to-file@0.3.0",
  "trussed@0.2.0",
  "zeroize@1.9.0",
]

