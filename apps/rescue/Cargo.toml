[package]
name = "fapico2-rescue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fapico2-platform = { path = "../../platform" }
heapless = "0.8"

[features]
default = ["host"]
# `host` keeps the crate `std` (host/emulation build). When off (device build)
# the crate is `no_std` — the same heapless implementation compiles for both,
# so this feature is a marker that selects the memory model (the same shape
# `apps/vendor_led/Cargo.toml` uses).
host = []
# Device (RP2350) back end marker: the firmware enables this to build the applet
# for `thumbv8m` `no_std`.
device = []

[dev-dependencies]
# Test-only edge, and it is the only dependency this crate has outside
# `fapico2-platform` — a deliberate one. The INS collision this applet shares
# with the Management applet (`0x1C`/`0x1D`/`0x1E` at both AIDs) is a property
# of the *pair*, so `a_proprietary_cla_reaching_the_management_applet_is_refused_not_mis_executed`
# drives a real `ManagementApp` rather than asserting that a constant is
# 0x6E00. A dev-dependency is never linked into the firmware, so the shipped
# build keeps the platform-only edge the module docs describe.
fapico2-mgmt = { path = "../mgmt" }
