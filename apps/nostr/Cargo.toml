[package]
name = "fapico2-nostr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fapico2-platform = { path = "../../platform" }
heapless = "0.8"

# The applet's crypto, declared with the skeleton so the supply-chain gates
# (US-1635 licences, US-1636 vet/SBOM/crate-graph) see the real closure
# before the commands land. All four are the spike's measured set
# (`spike-secp256kfun/`, US-1634): BIP-340 signing via `secp256kfun`,
# NIP-44 v2 via sha2/hmac/chacha20. `default-features = false` throughout —
# the device build is `no_std` and nothing here gets `std`.
secp256kfun = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
chacha20 = { version = "0.9", default-features = false }

[features]
default = ["host"]
# `host` keeps the crate `std` (host/emulation build). When off (device build)
# the crate is `no_std` — the same heapless implementation compiles for both,
# so this feature is a marker that selects the memory model (the same shape
# `apps/vendor_led/Cargo.toml` uses).
host = []
# Device (RP2350) back end marker: the firmware enables this to build the applet
# for `thumbv8m` `no_std`.
device = []
