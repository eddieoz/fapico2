# Gate falsifiability — the mutation half (US-1040/US-1041; wired 2026-10-07).
#
# WHY THIS IS A SEPARATE WORKFLOW
# ---------------------------------------------------------------------------
# `tests/scripts/test_gates.py` runs every gate twice on a copy of the tree:
# once as-is (must be green) and once with a nominated defect (must go red).
# That second run is the only evidence that a gate *bites* rather than merely
# existing, and it is the thing that catches a gate which has quietly stopped
# looking at anything.
#
# It also costs cold builds — several gates rebuild the device ELF, others run
# `cargo test` — so it cannot sit on every pull request. What it must not do is
# sit on nothing, which is the state it was in until this workflow: referenced
# by no step anywhere, holding two anchors that had rotted (the harness said so
# out loud the first time anyone ran it). "A gate that nothing runs is not a
# gate" is this repository's own rule, and it applied to the harness itself.
#
# The fast structural half (`--workflows-only`: docs-only reachability, the
# US-1043 ratchet wiring, the US-1010 RAM ceiling) runs unconditionally in
# ci.yml's gates-py job, where it costs about a second and needs no toolchain.
#
# WHY NIGHTLY + MAIN-PUSH AND NOT EVERY BRANCH PUSH (changed 2026-11-11)
# ---------------------------------------------------------------------------
# This used to trigger on every push touching `tests/scripts/**` or
# `.github/workflows/**`, deliberately unbranched: a branch pushed to this
# repository that edits a gate script is exactly when the harness is worth
# running. The cost of that principle turned out to be a red X on nearly every
# push a feature branch made — the harness ran, and failed, on branches whose
# actual gate coverage was already being asserted by `--workflows-only` in
# ci.yml, and the failures were indistinguishable from the PR's own check
# failures (this is cause #3 in docs/ci-evaluation-2026-11.md).
#
# The trigger is now: nightly (03:30 UTC), push to `main` with the same paths
# filter, and `workflow_dispatch`. The 60-day scheduled-workflow disablement
# that argued for push-over-cron is answered two ways: this repository is
# active (fuzz-nightly has run daily for months), and the nightly run's job
# redoes the full table — a silently dead cron would be caught by the next
# main-landing that touches a gate script. A PR branch that edits a gate
# script is still asserted on: ci.yml's wiring half runs for every PR, and the
# full table confirms the branch's gates bite when the series lands on main.
#
# RESIDUAL RISK
# ---------------------------------------------------------------------------
# A gate can rot without its own file changing — the document or the workflow
# it reads can move instead. That case is not covered here and is not claimed
# to be: the anchors are chosen so that the inputs they depend on are either
# in the gate script or a format constant (see `_B_SIZE_REPORT`), and a rot
# that needs a different file is caught the next time this job runs. The
# alternative — running the mutation table on every PR — buys that coverage at
# the price of the minutes this workflow exists to keep off the PR path.
name: Gates (mutation)

on:
  push:
    branches: [main]
    paths:
      - 'tests/scripts/**'
      - '.github/workflows/**'
  schedule:
    # Off the hour on purpose, next to fuzz-nightly's 03:17. Nightly keeps the
    # table running even when no gate script moves for weeks.
    - cron: '30 4 * * *'
  workflow_dispatch:

# Same least-privilege posture as ci.yml: this workflow executes repository
# code, so the token it hands every job is read-only.
permissions:
  contents: read

jobs:
  mutation:
    name: gate mutation harness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # The pinned toolchain from rust-toolchain.toml, with no channel argument
      # (naming `stable` installs components on a toolchain cargo does not
      # select — the defect ci.yml's setup steps document at length).
      - name: Set up Rust (pinned by rust-toolchain.toml)
        working-directory: fapico2
        run: rustup toolchain install --profile minimal --no-self-update
      # The harness copies the tree into its own temp dirs and gives every gate
      # its own target dir, so the cache cannot serve those builds — but the
      # warm-build step below and the registry/git share it warms are what the
      # copies start from.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fapico2
      - name: Cache the cargo-vet binary (v0.13.0)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.13.0-${{ runner.os }}
      - name: Add RP2350 target + ARM ELF linker
        run: |
          rustup target add thumbv8m.main-none-eabi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      # Several gates build the device ELF inside their own copy of the tree
      # (`check_boot_chain`, `check_async_frame`, `check_size_report`), and the
      # harness deliberately gives each gate its own target directory so one
      # gate's build cannot leak into the next gate's baseline. This step
      # therefore only warms the cargo registry and fails fast on a tree that
      # does not build at all.
      - name: Warm the build (and fail fast on a broken tree)
        working-directory: fapico2
        run: cargo build --release --target thumbv8m.main-none-eabi
      # `check_supply_chain.py` shells out to `cargo vet`, and the harness
      # requires every gate's BASELINE run to be green: a gate that is already
      # red on an unmodified copy proves nothing about its break, and the
      # harness reports that as a failure rather than absorbing it. The first
      # CI run of this workflow failed exactly there — `check_supply_chain.py`
      # BASELINE-RED in 0.2 s because the tool was not installed. Installed
      # from source with `--locked` (skipped when the cache above holds it),
      # the way ci.yml's supply-chain job does it, so this workflow still names
      # no action it does not need.
      - name: Install cargo-vet (the one gate that shells out to an external tool)
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-vet" ]; then
            cargo install cargo-vet --locked
          else
            echo "cargo-vet restored from cache"
          fi
      - name: "Mutation harness — every gate run twice, once with a nominated defect"
        working-directory: fapico2
        run: python3 tests/scripts/test_gates.py
