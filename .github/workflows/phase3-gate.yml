# Phase 3 integration gate (US-360).
#
# One job that builds the Rust emulation binary ONCE and runs every Phase 3
# suite against it:
#   oath-otp  cargo host unit tests  (OATH + OTP, fapico2-oath) + platform
#               (dispatcher / US-359 app-switching parity) — no emulator.
#   fido      pico-fido2/tests/pico-fido    pytest, HID transport
#   openpgp   pico-fido2/tests/openpgp      pytest, CCID transport
#   merged    pico-fido2/tests/merged       pytest, interleaved cross-app
# Each pytest suite runs against its own fresh emulator instance (isolated — a
# failure in one suite never cascades into another). run_all_tests.sh prints a
# per-suite PASS/FAIL summary and exits non-zero if any suite fails.
name: Phase 3 Gate

on:
  push:
    # main is the default branch after the US-724 history rewrite; master is
    # kept so the transition (and any old clones pushing to master) stay green.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege. This runs on `pull_request`, i.e. it executes untrusted
# fork code; the job needs to read the repository and nothing more.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2 (Rust firmware + gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # Sibling harness repo (published first, per US-725): when it is absent
      # (owner hasn't pushed pico-fido2 yet), the checkout and the gate step
      # that depends on it are skipped instead of turning this job red.
      - name: Checkout pico-fido2 (Python test suites)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pico-fido2
      # This used to be `actions/setup-rust@v1`, which DOES NOT EXIST (the
      # GitHub API 404s for that repository). The workflow therefore failed at
      # "Set up job" on every run, before reaching a single step. `rustup`
      # ships with the runner and rust-toolchain.toml pins the channel, so the
      # action was never required in the first place.
      - name: Set up Rust (stable; host target for the emulator + clippy)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        if: ${{ hashFiles('pico-fido2/tests/requirements.txt') != '' }}
        run: |
          python -m venv .test-venv
          ./.test-venv/bin/pip install --upgrade pip
          ./.test-venv/bin/pip install -r pico-fido2/tests/requirements.txt
      - name: Phase 3 integration gate
        if: ${{ hashFiles('pico-fido2/tests/requirements.txt') != '' }}
        env:
          # Both repos are siblings under $GITHUB_WORKSPACE; run_all_tests.sh
          # derives FAPICO2 and TESTS from PICO_ROOT.
          PICO_ROOT: $GITHUB_WORKSPACE
        run: fapico2/run_all_tests.sh
