# Release (RS-KEY-ADOPT Phase 7, US-1062 / US-1063 / US-1064).
#
# WHAT IS EXERCISED AND WHAT IS NOT — read this before trusting a green run
# ------------------------------------------------------------------------
# The first RELEASE of this project. The two gates below, and the SBOM
# stamper, were written in a session with no GitHub Actions runner, no OIDC
# issuer, no Fulcio, no Rekor, and no RP2350, so the cosign and attestation
# steps were *unexercised code*. `workflow_dispatch` takes a `dry_run` input,
# defaulting to TRUE, which runs the entire build -> sign -> attest -> verify
# chain and publishes nothing; run that first. Expect the first real run to
# need fixing — that is what the dry run is for, and it is why the default is
# a dry run rather than a publish.
#
# Two defects were found by reading rather than running, and are fixed here:
# the provenance and agreement gates both hardcoded the *previous* repository
# name (`eddieoz/pico-fido2`), so a genuine attestation from this repository
# would have been refused as built-elsewhere; and the SBOM carried no digest
# of the image, so the US-1064 gate had nothing to compare the UF2 against.
# Both are policy, not plumbing, and both are now exercised by the committed
# fixtures on every push.
#
# The chain of custody, and why there is only ONE mechanism per property
# ------------------------------------------------------------------------
#   0. the tag is the authority on WHICH commit this is
#        -> the annotated, GPG-signed `v*` tag a maintainer pushes. This
#           workflow never creates or moves a tag; `gh release create` runs
#           with `--verify-tag` so a Release can only ever describe a tag
#           that exists on the remote.
#   1. the image is a function of the source
#        -> ci.yml, device-build, US-1043: two independent builds from two
#           source directories, compared with `cmp`, plus the flash-budget
#           ratchet. Not repeated here. A second copy of that check would be
#           two ratchets to keep in step, which is the failure mode US-1043
#           was written to end.
#   2. the committed UF2 is that image
#        -> ci.yml, US-1080 staleness gate; and again here, as a `cmp`
#           against the artefact about to be published, because "the file in
#           the repository" and "the file being released" are different claims
#           on different machines.
#   3. the released UF2, its SBOM and its provenance all describe the same
#      bytes
#        -> check_artefact_agreement.py (US-1064), which is the only place
#           the three are compared.
#   4. the SET of assets belongs to ONE tag
#        -> the release manifest. The attestation covers one subject, so on
#           its own it leaves a gap: several assets with nothing saying they
#           go together or that they came from this tag. The manifest names
#           the tag, the commit and every asset's digest. It is currently
#           UNSIGNED — cosign is deferred, see below — so it carries
#           integrity, not authenticity. What makes it trustworthy is that
#           the tag it names is GPG-signed: check the tag, read the
#           manifest, and every asset is pinned to that one version.
#
# Signing
# ------------------------------------------------------------------------
# COSIGN IS DEFERRED. The published artefacts are NOT cosign-signed; the
# GPG-signed tag is the trust anchor. What was tried, and why it was
# removed rather than shipped, is recorded at the step where it used to
# be. There is no private key in this repository and none should ever be:
# the only key this project should hold is the future
# secure-boot key, which is a different thing for a different subsystem
# (US-1082, not this epic). When cosign was in use it signed in KEYLESS
# mode, where the signing identity is the GitHub Actions OIDC token, bound
# to this repository, this workflow and this ref by Fulcio — so a signature
# would have said WHO built the artefact, not merely that somebody with a
# key pressed a button.
#
# The TAG is GPG-signed by a maintainer, and that is the anchor that
# remains. It answers a different question from the one cosign would have:
# the tag signature proves a PERSON decided this is v1.0.0, which is the
# claim a release actually rests on. A Release is only as trustworthy as the
# tag it names, which is why publication runs `--verify-tag` and why nothing
# here creates or moves a tag.

name: release

on:
  workflow_call:
    inputs:
      tag:
        description: release tag, e.g. v1.0.0
        required: true
        type: string
  # Manual release (the primary path). A merge to main publishes NOTHING —
  # see the design note below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to build and publish, e.g. v1.0.0'
        required: true
        type: string
      dry_run:
        description: >-
          Build, sign, attest and verify, but publish nothing. DEFAULT TRUE.
          The first dispatch of this workflow should be a dry run: the signing
          and attestation steps below have still never executed, so use this
          to exercise them before anything is published.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

# WHY THERE IS NO RELEASE-ON-MERGE
# ------------------------------------------------------------------------
# Publishing is manual, deliberately. Auto-publishing on every merge to main
# would mint a Fulcio certificate and a public Rekor entry per merge, which
# turns a mistyped push or a compromised dependency into a *signed, published*
# artefact. Attestation is cheap; publishing signed things automatically is
# the expensive part.
#
# The cost of that choice is that this path stays unexercised until a human
# runs it, which is what `dry_run` above exists to bound: run it, watch it
# fail, fix it, and only then publish.
#
# Note also what CI is and is not allowed to build. The secure-boot private
# key is deliberately OUTSIDE this repository (see .gitignore: `secrets/*`),
# so the artefact produced here is UNSIGNED for secure boot. cosign and the
# attestation prove *provenance* — that these bytes came from this workflow —
# and say nothing about the device's boot seal. See docs/secureboot.md.

permissions:
  contents: read

jobs:
  release:
    name: build, sign and attest
    runs-on: ubuntu-24.04
    permissions:
      # Keyless signing needs an OIDC token. This is the whole reason there
      # is no key to leak.
      id-token: write
      # `actions/attest-build-provenance` pushes an attestation to the
      # repository's own attestation store.
      attestations: write
      contents: write
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fapico2
          persist-credentials: false
      # No third-party action: `rustup` ships with the runner and the committed
      # rust-toolchain.toml pins the channel. dtolnay/rust-toolchain resolves
      # its toolchain from a *branch* (stable, `protected: false`), so
      # SHA-pinning it would freeze the action code while leaving the
      # ref -> toolchain mapping mutable — in the one job that holds
      # `id-token: write`. Removing the dependency removes the question.
      - name: Set up Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Add RP2350 target + ARM ELF linker
        run: |
          rustup target add thumbv8m.main-none-eabi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # cargo-vet, for US-1061. This step was MISSING the first time the
      # workflow was dispatched: `check_supply_chain.py` runs `cargo vet` and
      # treats the tool being absent as a RED rather than a skip, so the very
      # first dry run died here with "no such command: `vet`" before building
      # anything. It is installed from source with `--locked` rather than
      # through a third-party installer action, for the same reason the Rust
      # toolchain is not: this job holds `id-token: write`, and every action
      # named in it is a supply-chain path. Same command as ci.yml.
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked

      # UNEXERCISED until the first tag. Kept honest by the fact that every
      # gate it calls is exercised on every push.
      - name: "Gate: the crate graph and the supply chain (US-1060/US-1061)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          python3 tests/scripts/check_crate_graph.py
          python3 tests/scripts/check_supply_chain.py
          echo "ok: crate graph + supply chain green"
      - name: "Gate: the SBOM matches the locked graph (US-1062)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          python3 tests/scripts/check_sbom.py
          echo "ok: SBOM green"

      - name: Build the release image
        working-directory: fapico2
        run: |
          set -euo pipefail
          cargo build --release --target thumbv8m.main-none-eabi
          # `dist/` did not exist on the second dry run either:
          # `uf2gen.py` opens its output with `open(path, "wb")`, which does
          # not create the parent, so the build succeeded and the UF2 step
          # died with FileNotFoundError on a directory nobody had made. Every
          # later step writes here too, so it is created once, here.
          mkdir -p dist
          python3 firmware/uf2gen.py \
            target/thumbv8m.main-none-eabi/release/fapico2-firmware \
            dist/fapico2.uf2 >/dev/null
      # Step 2 of the chain of custody: the image published here is built from
      # the tag's source by this run — no build output is committed, so there
      # is no separate "committed image" that could drift from what ships. CI
      # (ci.yml) has already established that this build is reproducible, and
      # the provenance attestation below binds this exact dist/fapico2.uf2 to
      # this workflow run.
      - name: "Gate: the image is a product of this build"
        working-directory: fapico2
        run: |
          set -euo pipefail
          test -s dist/fapico2.uf2
          echo "ok: releasing the image this run built ($(stat -c %s dist/fapico2.uf2) B)"

      # US-1062: the SBOM travels WITH the artefacts, not merely in the repo.
      - name: Attach the SBOM to the release artefacts
        working-directory: fapico2
        run: |
          set -euo pipefail
          cp supply-chain/sbom.cdx.json dist/sbom.cdx.json
          # The SBOM says what the image is BUILT FROM; the digest of the image
          # itself is a separate fact and a per-build one, so it is stamped
          # into the COPY rather than committed. Without it the US-1064 gate
          # has nothing to compare the UF2 against. The committed file is not
          # touched — see tests/scripts/stamp_sbom_image.py for why.
          python3 tests/scripts/stamp_sbom_image.py \
            --image dist/fapico2.uf2 --sbom dist/sbom.cdx.json
          # Release mode: the SBOM must be present NEXT TO the artefact being
          # published, or the release is refused. This is the US-1062 red.
          python3 tests/scripts/check_sbom.py --artifacts dist

      # COSIGN IS DEFERRED — THIS RELEASE IS NOT COSIGN-SIGNED.
      # ------------------------------------------------------------------------
      # Removed 2026-10-01, and deliberately, not accidentally.
      #
      # cosign v3 changed `sign-blob`'s output contract, so the install is
      # pinned to the last v2 (2.6.1) to keep the `.sig` + `.pem` pair both
      # gates are written against. On v2.6.1 keyless signing succeeds and
      # reports "Wrote certificate to file dist/fapico2.uf2.pem" — and writes
      # 3312 bytes that are not a PEM: no BEGIN CERTIFICATE, no Fulcio OID,
      # no issuer anywhere in the file. A keyless signature cannot be
      # reproduced outside GitHub Actions, so the shape could not be
      # diagnosed from a developer machine, and cosign was removed rather
      # than shipped with a signature check that had never passed.
      #
      # WHAT THIS COSTS, stated plainly: a published artefact is no longer
      # proven by a signature over it. The US-1063 gate is invoked with
      # --unsigned, which skips P2 (the signer's OIDC issuer) and says so in
      # its own output; without that flag the gate still refuses an unsigned
      # release, so the check cannot go missing quietly. The US-1064 gate
      # skips A4 for its own reasons — cosign is not installed, which it has
      # always reported as SKIPPED rather than passed.
      #
      # WHAT STILL HOLDS: the GPG-signed tag is the trust anchor and is not
      # affected. CI has already established the image is reproducible from
      # the source; the SBOM is attached and carries the image digest; the
      # build-provenance attestation is still minted and still binds the
      # subject to this workflow; and the release manifest still records the
      # tag, the commit and every asset's digest.
      #
      # TO RESTORE: reinstall cosign (2.6.1 or a migrated bundle-based
      # contract), drop --unsigned, and re-run. The gates are unchanged and
      # will enforce P2 and A4 again the moment they can.

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: fapico2/dist/fapico2.uf2
      - name: Fetch the attestation for the policy check
        working-directory: fapico2
        env:
          # `gh` is not authenticated by default in Actions; without this it
          # can only read a PUBLIC attestation store, and this one belongs to
          # this repository's own store.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh attestation download` has NO --format and NO --output. It
          # writes ONE file into the current directory, named after the
          # artefact's digest — `sha256-<hex>.jsonl`. Everything this step
          # used to say about formats and output paths was invented: the
          # fourth dry run died on `unknown flag: --format`.
          #
          # So: run it, find the file it named after OUR digest (computed
          # here rather than globbed blindly, so a stale file from an earlier
          # step cannot be mistaken for this one), and hand it to the
          # extractor. The digest is quoted in both spellings because gh uses
          # a colon on POSIX and a dash on Windows.
          DIGEST=$(sha256sum dist/fapico2.uf2 | cut -d' ' -f1)
          rm -f "sha256:${DIGEST}.jsonl" "sha256-${DIGEST}.jsonl"
          gh attestation download dist/fapico2.uf2 \
            --repo "${{ github.repository }}"
          FOUND=""
          for name in "sha256:${DIGEST}.jsonl" "sha256-${DIGEST}.jsonl"; do
            [ -f "$name" ] && { FOUND="$name"; break; }
          done
          if [ -z "$FOUND" ]; then
            echo "::error::gh attestation download produced no file for sha256:${DIGEST} (looked for sha256:….jsonl and sha256-….jsonl). What it did write: $(ls -1 *.jsonl 2>/dev/null || echo nothing)"
            exit 1
          fi
          # What gh returns is a Sigstore bundle, not the in-toto statement
          # the gates read. extract_provenance.py reduces it and says which
          # shape it found, so this run's log records it.
          python3 tests/scripts/extract_provenance.py \
            --input "$FOUND" --output dist/provenance.json
          rm -f "$FOUND"
          test -s dist/provenance.json
      # US-1063's refusal half: the attestation has to name THIS reusable
      # workflow (`job_workflow_ref`), not merely come from something that
      # passed CI. cosign has already checked the signature by this point;
      # this checks that the statement is about the artefact we are about to
      # publish, produced by the workflow we say produced it.
      - name: "Gate: the attestation is about this artefact and this workflow"
        working-directory: fapico2
        run: |
          set -uo pipefail
          # --unsigned: cosign is deferred, so there is no certificate to read
          # an OIDC issuer out of and P2 cannot be checked. The flag is an
          # escape hatch, not a relaxation — without it this gate still
          # refuses an unsigned release, and with it the gate says out loud
          # that the signer's identity was not verified. See the cosign note
          # above for what this costs and what still holds.
          if ! python3 tests/scripts/check_release_provenance.py \
               --attestation dist/provenance.json \
               --subject dist/fapico2.uf2 \
               --unsigned \
               --expected-commit "$GITHUB_SHA" \
               --expected-workflow .github/workflows/release.yml; then
            echo "::error::The build-provenance attestation was refused: it does not name this reusable release workflow, or its subject digest is not this UF2 (US-1063)."
            exit 1
          fi
      # US-1064: the three artefacts must agree. This is the story that makes
      # the other three non-decorative.
      - name: "Gate: UF2, SBOM and attestation agree"
        working-directory: fapico2
        run: |
          set -uo pipefail
          if ! python3 tests/scripts/check_artefact_agreement.py \
               --artifacts dist \
               --attestation dist/provenance.json; then
            echo "::error::The released UF2, its SBOM and its provenance attestation do not agree. Refusing to publish (US-1064)."
            exit 1
          fi
          echo "ok: UF2, SBOM and attestation agree"

      # THE RELEASE MANIFEST — what binds the SET of artefacts to the tag.
      # ------------------------------------------------------------------------
      # The attestation covers ONE subject. So on its own it leaves a gap a
      # release could fall into: several assets with nothing saying they
      # belong together or belong to v1.0.0 rather than some other tag.
      #
      # The manifest is the join. It names the tag and the commit, and the
      # sha256 and byte length of every published asset, so a verifier can
      # confirm the set belongs to that one tag.
      #
      # It is NOT signed, because cosign is deferred (see above). What it
      # carries is integrity, not authenticity: it says what this run
      # produced, and it is most useful precisely because the tag it names is
      # GPG-signed. A signature over it is the first thing to restore.
      #
      # The assertions inside keep it honest. Without them the manifest is
      # just a file that says whatever it was built to say: it re-reads the
      # UF2 and cross-checks it against the digest stamped in the SBOM, and
      # refuses to write a manifest that omits any published asset.
      - name: Build the release manifest
        if: ${{ inputs.dry_run != true }}
        working-directory: fapico2
        env:
          # `inputs.tag` is set by workflow_call and workflow_dispatch. On a
          # tag push it is empty, and github.ref_name IS the tag — so this
          # covers all three triggers without a per-trigger branch.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys

          dist = pathlib.Path("dist")
          tag = os.environ["RELEASE_TAG"]
          # The provenance gate above already proved the attestation's subject
          # is this UF2; here we only re-derive the digest from the bytes.
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          uf2 = dist / "fapico2.uf2"
          if not uf2.is_file():
              sys.exit(f"refusing: {uf2} is not there to describe")
          actual = digest(uf2)

          # The SBOM was stamped with this same digest a step ago. If the two
          # disagree, one of them is describing a different image.
          sbom = json.loads((dist / "sbom.cdx.json").read_text())
          props = {p.get("name"): p.get("value")
                   for p in sbom.get("metadata", {}).get("properties", [])}
          stamped = props.get("cdx:fapico2:uf2:sha256")
          if stamped != actual:
              sys.exit(f"refusing: the SBOM records {stamped}, the image is {actual}")

          files = {}
          for name in ("fapico2.uf2", "sbom.cdx.json", "provenance.json"):
              p = dist / name
              if not p.is_file():
                  sys.exit(f"refusing: {p} is missing; the manifest must "
                           f"describe every published asset")
              files[name] = {"sha256": digest(p), "bytes": p.stat().st_size}

          manifest = {
              "schema": "https://fapico2.dev/release-manifest/v1",
              "project": "fapico2",
              "tag": tag,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "image": {"name": "fapico2.uf2", "sha256": actual},
              "files": files,
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(f"manifest: {tag} @ {manifest['commit'][:8]}, "
                f"{len(files)} assets, image {actual[:12]}…")
          # The tag recorded must be the tag being released. On a dispatch
          # where someone typed a tag that is not this ref, the Release would
          # describe a tag nobody built.
          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if tag != ref_name and not ref.endswith("/" + tag):
              print(f"note: {tag} is not the ref this run built from "
                    f"({os.environ.get('GITHUB_REF')}); the manifest names the "
                    f"requested release tag and the commit it was built at.")
          PY
          # NOT signed: cosign is deferred. Say so in the log, so a reader of
          # this run does not infer a signature that does not exist.
          echo "manifest: written but UNSIGNED (cosign deferred); the trust anchor is the GPG-signed tag"

      # CREATE THE RELEASE. Publication is the ONLY step the dry run skips.
      # Everything above it — the gates, the build, the cosign signatures, the
      # attestation, both verification gates, and the manifest — runs
      # identically either way, so a dry run is a real exercise of the signing
      # path and not a rehearsal of it.
      #
      # `--verify-tag` is load-bearing: a Release must describe a tag that
      # exists on the remote, which is what stops a release describing a commit
      # that was never tagged, and what keeps the GPG-signed tag the user made
      # the authority on which commit this is.
      - name: Create the GitHub Release
        if: ${{ inputs.dry_run != true }}
        working-directory: fapico2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "fapico2 $RELEASE_TAG" \
            --notes-file docs/release-notes-v1.0.0.md \
            dist/fapico2.uf2 \
            dist/sbom.cdx.json \
            dist/provenance.json \
            dist/release-manifest.json
          echo "published: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"

      - name: Publish the release artefacts
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fapico2-release
          path: |
            fapico2/dist/fapico2.uf2
            fapico2/dist/sbom.cdx.json
            fapico2/dist/provenance.json
            fapico2/dist/release-manifest.json

      # A dry run that ends in silence is indistinguishable from a broken
      # workflow. Say so explicitly, and name what was exercised.
      - name: "DRY RUN — gates exercised, nothing published"
        if: ${{ inputs.dry_run == true }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "### Dry run — no Release was created" >&2
          echo "" >&2
          echo "Everything below ran for real. The only thing skipped is" >&2
          echo "publication, so this is an exercise of the signing path and" >&2
          echo "not a rehearsal of it." >&2
          echo "" >&2
          echo "- built \`dist/fapico2.uf2\` from this run's source" >&2
          echo "- stamped its digest into the release SBOM" >&2
          echo "- minted a build-provenance attestation for it" >&2
          echo "- passed the provenance gate with --unsigned (P2 NOT CHECKED)" >&2
          echo "- passed check_release_provenance.py and check_artefact_agreement.py" >&2
          echo "" >&2
          echo "**This release is NOT cosign-signed** — cosign is deferred." >&2
          echo "" >&2
          echo "**Not exercised by a dry run:** the release manifest and" >&2
          echo "\`gh release create\`. Both are gated on" >&2
          echo "\`dry_run != true\` because the manifest is only meaningful for" >&2
          echo "a Release that exists. To exercise them, push the tag — that is" >&2
          echo "the publish." >&2
          {
            echo "### Dry run — gates exercised, no Release created"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| build + UF2 | ok |"
            echo "| SBOM image digest stamped | ok |"
            echo "| cosign signature | **not applied (deferred)** |"
            echo "| build-provenance attestation | ok |"
            echo "| provenance policy (US-1063) | ok, P2 skipped (--unsigned) |"
            echo "| artefact agreement (US-1064) | ok |"
            echo "| release manifest | **skipped (publish-only)** |"
            echo "| GitHub Release | **skipped (publish-only)** |"
            echo ""
            echo "Tag under test: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
