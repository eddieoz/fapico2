# CI pipeline (US-381) — one workflow gating every push.
#
# Five gates, per EPIC RUST-MIGRATION Phase 5:
#   1. host-tests   cargo test --workspace      (host unit tests; device crate
#                                                excluded — it is no_std + arm-only
#                                                and has no host-testable lib)
#   2. clippy       cargo clippy -- -D warnings (no warnings on any host crate)
#   3. device-build cargo build --release       (RP2350 / thumbv8m device ELF)
#                  + size gate (text <= 3.5 MiB flash ceiling, US-382)
#   4. no-heap      heap gate: exactly one *sanctioned* #[global_allocator]
#                  (platform/src/rsa_heap.rs, US-938) + the device firmware
#                  is #![no_std] + nothing allocates before rsa_heap::init()
#                  (US-383; rewritten US-961 when the token grep went red on
#                  the sanctioned allocator)
#   5. pytest-gate  full Phase 3 exit gate      (fapico2's own emulator suites:
#                                                tests/pico-fido, tests/piv,
#                                                tests/openpgp, tests/harness —
#                                                see the job for what blocks)
#
# Plus the standalone structural gates: persist-gate, attestation-gate, and
# advertise-serve-gate (US-962/US-964 — the default *and* the reduced build of
# the advertise/serve coupling check; it existed as a script nothing ran, which
# is why a one-line manifest mutation kept every signal green).
#
# Layout: fapico2 is checked out under $GITHUB_WORKSPACE/fapico2 and every gate
# runs against THAT tree. There is no second checkout: the pytest suites and
# their requirements are in this repository (tests/, tests/requirements.txt).
name: CI

on:
  push:
    # main is the default branch after the US-724 history rewrite; master is
    # kept so the transition (and any old clones pushing to master) stay green.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # US-1043 (RS-KEY-ADOPT Phase 5): the flash-budget RATCHET, RS-Key's
  # FIRMWARE_FLASH_BUDGET_KIB pattern. It is a CEILING on the shipping image
  # (firmware/fapico2.uf2), not on the ELF text — the UF2 is what actually
  # occupies flash, and it is the artifact that is flashed.
  #
  # 1532 KiB against a measured 1567232 B (1530.5 KiB, 3061 blocks): ~1.5 KiB
  # of slack. Tight on purpose. A ratchet with 20 % headroom is a number nobody
  # reads; this one turns ordinary growth into a red that says "raise it
  # deliberately, and say why". The absolute backstop is still the 3.5 MiB text
  # ceiling in the device-build job, which this does not replace.
  #
  # 2026-10-07: the ratchet no longer runs at ZERO headroom, and that is a
  # deliberate change of policy rather than a loosening. Zero headroom meant
  # every 512-byte block of ordinary growth failed CI and demanded a
  # five-file edit (this file, flashmap.rs, board_def.rs, the report, and the
  # mutation harness's anchor) — six "re-baseline" commits in three weeks, each
  # one unrelated to the change that triggered it. It now carries ~43 KiB,
  # about eight features at the measured per-feature growth, so it fires on
  # notable growth and the raise is a decision. Raising it is ONE command that
  # moves every copy:
  #
  #     python3 tests/scripts/raise_flash_budget.py <KiB> --reason "..."
  #
  # It refuses to raise past FIRMWARE_GROWTH_END (the trussed filesystem's
  # first byte, where every OpenPGP and PIV key lives) and refuses a raise
  # below the shipping image. The 3.5 MiB text ceiling above is ~2 MB away and
  # cannot fire on ordinary growth, so this remains the only near-term bound.
  #
  # US-1080 raised this from 1520. The 3 KiB it discharges is **not** US-1080's:
  # `firmware/fapico2.uf2` had drifted from the build (3038 committed blocks
  # against a 3046-block release ELF, measured on the pre-US-1080 tree too), so
  # the ratchet was being applied to an artefact nobody was flashing. US-1080
  # regenerated the artefact and measured 3046 blocks; the build chain check
  # (`cmp` against a fresh uf2gen run) is what makes that drift impossible to
  # repeat silently. See the US-1080 entry at the top of docs/size-report.md.
  #
  # US-OTP-HID raised this from 1524 to 1528. The +7 blocks / +3,584 B is the
  # second HID interface, the YK4 feature-report state machine, and the
  # composite `HidInterfacesHandler` — a feature, not drift. Three edits in the
  # same change cost 0 B (a dead 48-line handler the linker had already
  # dropped, an `int_plus_one` lint rewrite, and an unused import); that they
  # cost nothing is recorded in docs/size-report.md so this raise is not later
  # read as covering them. See the dated entry at the top of that file.
  #
  # 2026-10-01 raised this from 1528 to 1532. The +8 blocks / +4,096 B is **not
  # a feature**: it is the cargo-deps group PR #2 having been merged and then
  # reverted, which moved the whole `Cargo.lock` and so changed what the
  # restored dependency closure compiles to (text 813,568 -> 815,576 B, .bss
  # 420,692 -> 420,704 B). The only source edits in the same commit are
  # clippy — a `Default` derive in both fido twins and one write-only field
  # dropped — which are byte-neutral in intent and carry none of the growth.
  # Measured and recorded at the top of docs/size-report.md.
  #
  # 2026-10-02 raised this from 1532 to 1536. The +10 blocks / +5,120 B is the
  # US-1519 passkey-discovery epic (capFlags 0x05, the bounded HID read/write
  # deadlines, the Phase C non-blocking consent window, CTAPHID_CANCEL, the
  # keepalive protocol, the emulator parity migration and the aligned CTAP2
  # error table) plus the `PendingUp` consent slot that carries it. It IS a
  # feature, unlike the 2026-10-01 entry above. Shrinking was attempted first
  # and did not pay: the two async helpers that hold the loop were outlined and
  # that cost +428 B of text, `emul_hid.rs` was already `cfg`-gated out of the
  # device image (0 symbols), and the remaining growth is the reviewed fixes.
  # The slack this leaves is 512 B (1536 KiB = 1,572,864 B against a measured
  # 1,572,352 B) — the smallest whole-KiB value that fits, which is what this
  # ratchet is for. Measured and recorded at the top of docs/size-report.md.
  #
  # 2026-10-06 raised this from 1536 to 1621. The ratchet had already been
  # exceeded — the US-15xx epics grew the shipping image to 3,247 blocks
  # (1,662,464 B) — but every CI run between 2026-10-05 and this fix died at
  # the boot-chain gate two steps earlier, so the ratchet never got to say
  # so. The rustc 1.99.0 boot-chain fix (docs/size-report.md, 2026-10-06
  # entry) regenerated the image at 3,242 blocks = 1,659,904 B = **1,621 KiB
  # exactly**: zero headroom again, per this ratchet's own philosophy — the
  # next 512 B anywhere trips it. `text` fell 1,204 B in the same change, so
  # the raise carries drift the tree already had, not new growth from the
  # fix. Measured and recorded at the top of docs/size-report.md.
  # 2026-10-07 raised this from 1621 to 1664 KiB, on purpose, with the reason
  # recorded here because the number is the layout's argument: headroom for the
  # region walk and the credMgmt 0x41 route — 43 KiB is about eight features at
  # the measured per-feature image growth (US-OTP-HID +3,584 B, US-1519
  # +5,120 B), so the ratchet fires on notable growth rather than on every
  # 512-byte block.
  FIRMWARE_FLASH_BUDGET_KIB: 1664
# Least privilege by default. This workflow runs on `pull_request`, which
# EXECUTES UNTRUSTED FORK CODE, so the GITHUB_TOKEN it hands to every job is
# the largest exposure in the tree. Previously this file declared no
# `permissions:` block at all, which meant every job inherited the
# repository-default token — typically read/write on most repos.
#
# `contents: read` is all any job here needs: they check out this repo and
# build. Nothing in CI publishes, attests or signs, so nothing needs write,
# and no job needs `id-token: write` (that is the release lane's alone —
# see release.yml, and do not widen it here).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1/4 — cargo test --workspace (host unit tests: platform, fido, oath,
  #      openpgp, mgmt). The device crate (fapico2-firmware) is excluded here:
  #      its BINARIES are a #[no_main] arm-only target and cannot build for the
  #      host. Its LIBRARY can (`#![cfg_attr(not(test), no_std)]` plus a
  #      `default = ["device"]` feature set that resolves to host deps), and it
  #      is where the presence/ctap_hid/ccid_reasm unit tests live — so it gets
  #      its own step below. US-1021 added the first test in this tree that
  #      gates device-only behaviour, and a gate nothing runs is not a gate.
  # ---------------------------------------------------------------------------
  host-tests:
    name: cargo test --workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # No third-party action: `rustup` ships with the runner and the committed
      # rust-toolchain.toml pins the channel and target. dtolnay/rust-toolchain
      # resolves its toolchain from a *branch* (stable/nightly, both
      # `protected: false`), so SHA-pinning it would freeze the action code
      # while leaving the ref -> toolchain mapping mutable. Removing the
      # dependency removes the question.
      #
      # `--profile minimal` plus the components named in rust-toolchain.toml,
      # and **no channel argument**: `rustup toolchain install` with an explicit
      # `stable` installs *that* toolchain, while `cargo` then honours
      # rust-toolchain.toml and runs the pinned one — so the components land on a
      # toolchain nothing uses. That is not hypothetical: with the channel
      # pinned to 1.99.0, the clippy job died with "'cargo-clippy' is not
      # installed for the toolchain '1.99.0'" (run 37308500832) while passing
      # locally, because clippy had been installed on `stable` instead.
      - name: Set up Rust (pinned by rust-toolchain.toml)
        working-directory: fapico2
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Workspace host unit tests
        working-directory: fapico2
        run: cargo test --workspace --target x86_64-unknown-linux-gnu --exclude fapico2-firmware
      # `--lib` only: the device bins are arm-only. `--test-threads=1` is
      # load-bearing, not a superstition — `ccid_reasm::tests` shares one
      # `NOW_MS` across six tests with no lock, so under cargo's default
      # per-file parallelism they advance each other's clock and
      # `partial_inside_window_is_not_dropped` fails intermittently (measured:
      # 1 in 3 runs, at 40 tests and again at 44). Serial execution is the
      # deterministic answer; fixing that module's own locking is its own
      # change and is not smuggled in here.
      - name: Firmware lib unit tests (presence / ctap_hid / ccid_reasm)
        working-directory: fapico2
        run: cargo test -p fapico2-firmware --lib --target x86_64-unknown-linux-gnu -- --test-threads=1
      # US-1524 parity, gated (2026-10-02). The step above builds
      # `--lib` under `default = ["device"]`, and `lib.rs` gates the
      # emulator half of the CTAP-HID seam on `feature = "emulation"`
      # alone — so `emul_hid`, and with it the whole six-test parity
      # suite, was COMPILED OUT of the only firmware test invocation in
      # CI. Measured before this step: 78 tests under `device`, 84 under
      # `device,emulation`; the delta is exactly the parity suite
      # (`the_emulator_and_the_shipped_loop_agree_report_for_report`,
      # `a_cross_channel_request_is_answered_inside_a_window`,
      # `a_cancel_with_nothing_pending_is_dropped_and_cannot_cancel_the_next_window`,
      # `a_cancel_inside_a_window_answers_keepalive_cancel`,
      # `a_long_reply_is_fragmented_the_same_way`,
      # `us1511_the_window_scenario_is_identical_on_both_paths`).
      #
      # This is the only evidence for the epic's DoD item 6 (emulator and
      # board answer identically), the entire anti-regression value of
      # US-1524, and the suite every pytest acceptance run and every emulator
      # suite in tests/ executes against. A gate that nothing runs is
      # not a gate — the same sentence this file already uses at the
      # `advertise-serve-gate` job, reproduced one level up.
      #
      # A SECOND step, not a widened first one, for two reasons:
      #   * the step above is the SHIPPING configuration's gate and stays
      #     that way on its own — `device` alone must stay green, or a
      #     parity change could mask a device-only break;
      #   * the count is the evidence. Two steps report 78 and 84
      #     separately, so a future `cfg` move that re-hides the suite
      #     shows up as the second step dropping back to 78.
      # `device,emulation` (not `emulation` alone) so the device path is
      # compiled in the same build the parity tests compare it against.
      # `--test-threads=1` for the same reason as above: the flake is in
      # `ccid_reasm::tests`, which this build also compiles, and it
      # reproduces here (measured 1 in 4 parallel runs).
      # `--lib`, because the emulation BIN target cannot build for the
      # host at all — `rp_pac`/`embassy_rp` are arm-scoped (118 errors at
      # the pre-epic base `ea298a6`). `run_tests.sh` only BUILDS that bin.
      - name: Firmware lib unit tests (emulation parity, US-1524)
        working-directory: fapico2
        run: cargo test -p fapico2-firmware --lib --features device,emulation --target x86_64-unknown-linux-gnu -- --test-threads=1

  # ---------------------------------------------------------------------------
  # 2/4 — cargo clippy -- -D warnings. A strict lint gate: any new warning on a
  #      host-buildable crate turns the build red (matches the FX-416 standard
  #      run_all_tests.sh already enforces for fido, extended to the workspace).
  #      The vendored `opcard` path dependency lints at its own `warn` level and
  #      is not part of this member gate.
  # ---------------------------------------------------------------------------
  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # No channel argument, for the reason on the first job's setup step:
      # naming `stable` installs components on a toolchain that
      # rust-toolchain.toml then does not select. `clippy` is named here rather
      # than left to the toolchain file so the component is visible at the step
      # that needs it.
      - name: Set up Rust (pinned + clippy)
        working-directory: fapico2
        run: |
          rustup toolchain install --profile minimal --component clippy --no-self-update
      - name: clippy (workspace, host target, all targets)
        working-directory: fapico2
        run: cargo clippy --workspace --target x86_64-unknown-linux-gnu --exclude fapico2-firmware --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # 3/4 — device integration gate (US-389): the RP2350 release build must be
  # size-bounded, clippy-clean with the device feature, heap-free, and the
  # committed flashable artifact (firmware/fapico2.uf2) must match the build.
  # The host-tests and no-heap jobs in this workflow cover the remaining gate
  # assertions (`cargo test --workspace` green, no #[global_allocator]).
  # Cortex-M33 = ARMv8-M -> thumbv8m.main-none-eabi. Needs the ARM ELF linker
  # (gcc-arm-none-eabi) to link the bare-metal binary.
  # ---------------------------------------------------------------------------
  device-build:
    name: device integration gate (RP2350)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # No channel argument, for the reason on the first job's setup step:
      # naming `stable` installs components on a toolchain that
      # rust-toolchain.toml then does not select. `clippy` is named here rather
      # than left to the toolchain file so the component is visible at the step
      # that needs it.
      - name: Set up Rust (pinned + clippy)
        working-directory: fapico2
        run: |
          rustup toolchain install --profile minimal --component clippy --no-self-update
      - name: Add RP2350 target + ARM ELF linker
        run: |
          rustup target add thumbv8m.main-none-eabi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Build release firmware
        working-directory: fapico2
        run: cargo build --release --target thumbv8m.main-none-eabi
      # US-939: the Embassy async-main task frame must fit the main stack —
      # the pre-fix image reserved 95,232 B against the RP2350 main stack and
      # dark-booted. Same invocation path as the repo-side size gate
      # (tests/scripts/check_size_report.py): a standalone script over the
      # release ELF.
      - name: "Async-frame gate — Embassy main-task frame <= 24 KiB"
        working-directory: fapico2
        run: |
          if ! python3 tests/scripts/check_async_frame.py; then
            echo "::error::The Embassy async-main frame exceeds the 24 KiB ceiling — a large value moved back into the async frame (US-939)."
            exit 1
          fi
          echo "async-frame gate PASS"
      # US-957: check_async_frame bounds ONE frame; the main stack has to
      # survive a whole call chain, and the chain runs through the
      # `Vec<&mut dyn App, N>` vtable — a `blx rN`, not a `bl`. Without this
      # step a large value moving onto the per-APDU request path (RSA,
      # secp256k1, Brainpool all live there, none on the boot path) merges
      # green. `--no-build`: the step above already produced the release ELF.
      - name: "Boot-chain gate — worst call chain <= min(96 KiB, the real stack zone)"
        working-directory: fapico2
        run: |
          if ! python3 tests/scripts/check_boot_chain.py --no-build; then
            echo "::error::The worst main-stack call chain exceeds min(96 KiB, the linker stack zone) — a large frame moved back onto the boot or per-APDU request path (US-956/US-957)."
            exit 1
          fi
          echo "boot-chain gate PASS"
      # US-389: the device feature must be clippy-clean (-D warnings), same
      # bar as the host clippy job.
      - name: "Clippy — device feature, -D warnings"
        working-directory: fapico2
        run: cargo clippy --target thumbv8m.main-none-eabi -- -D warnings
      # Size gate (US-382): the merged firmware must never silently cross the
      # RP2350 4 MiB flash budget. Ceiling = 4 MiB flash - 0.5 MiB
      # keystore/headroom = 3.5 MiB of text. Measured with the ARM binutils
      # `size` (the same section accounting cargo-size wraps) on the release
      # ELF; recorded next to the 530,980 B C baseline (US-208) in the job
      # summary. See docs/size-report.md for the budget rationale.
      - name: "Size gate — text <= 3.5 MiB flash ceiling"
        working-directory: fapico2
        run: |
          ELF=target/thumbv8m.main-none-eabi/release/fapico2-firmware
          TEXT=$(arm-none-eabi-size "$ELF" | awk 'NR==2 {print $1}')
          CEILING=$(( 7 * 1024 * 1024 / 2 ))    # 3.5 MiB = 3670016 bytes (bash is integer-only)
          C_BASELINE=530980
          echo "Rust device text = ${TEXT} B   (C baseline ${C_BASELINE} B, ceiling ${CEILING} B)"
          {
            echo "### US-382 size gate (RP2350 release ELF)"
            echo ""
            echo "| Firmware | text (bytes) |"
            echo "|---|---:|"
            echo "| Rust device (this build) | ${TEXT} |"
            echo "| C baseline (US-208, all apps) | ${C_BASELINE} |"
            echo "| Ceiling (4 MiB − 0.5 MiB headroom) | ${CEILING} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEXT" -gt "$CEILING" ]; then
            echo "::error::text ${TEXT} B exceeds the 3.5 MiB ceiling ${CEILING} B"
            exit 1
          fi
          echo "size gate PASS: text ${TEXT} B <= ceiling ${CEILING} B"
      # US-1010 / 2026-10-07: the size *budgets* over the rebuilt ELF. This
      # step used to require docs/size-report.md to equal the build byte for
      # byte — text, UF2 sha256, block count, the section table, the summary —
      # which meant every codegen change (a measured +56 B, or a −1,204 B
      # shrink) failed CI for a reason unrelated to the change, and the fix was
      # to hand-edit a 3,400-line document. It was weak as well as churny: the
      # presence checks were whole-document substring scans over ~99 historical
      # figures, and only the first of the document's two delimited copies was
      # validated.
      #
      # What blocks a pull request now is what decides whether the board boots
      # and fits: `text <= 3.5 MiB` and `bss <= RAM − the stack-chain ceiling`.
      # The measurements are printed on every run AND written to the step
      # summary, so nothing is hidden by the document no longer being a gate.
      # The document-equality check still exists, behind
      # `check_size_report.py --check-doc`; it is exercised by the mutation
      # harness (the `gates` job runs the wiring half, `gates-mutation.yml` the
      # full table). Refresh the document with
      # `python3 tests/scripts/check_size_report.py --update`.
      - name: "Size gate — text/bss budgets over the rebuilt ELF"
        working-directory: fapico2
        run: |
          set -o pipefail
          python3 tests/scripts/check_size_report.py 2>&1 | tee /tmp/size-gate.log
          rc=${PIPESTATUS[0]}
          {
            echo "### US-392/US-1010 size budgets (RP2350 release ELF)"
            echo ""
            echo '```'
            cat /tmp/size-gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::a size budget is exceeded (text > 3.5 MiB, or bss > RAM minus the stack-chain ceiling) — see the failure above (US-392/US-1010)."
            exit 1
          fi
          echo "size gate PASS"
      - name: Upload release ELF (RP2350)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fapico2-firmware-rp2350
          path: fapico2/target/thumbv8m.main-none-eabi/release/fapico2-firmware
      # US-389: the flashable artifact must be current. Regenerate the UF2
      # (RP2350-Arm family id; elf2uf2-rs 2.2.0 hardcodes the RP2040 family,
      # which the Pico 2 BOOTSEL rejects) and fail if the committed
      # firmware/fapico2.uf2 drifted from the build.
      #
      # US-1043 (RS-KEY-ADOPT Phase 5) extends this into a DOUBLE build and a
      # size ratchet, because the staleness check on its own cannot see the
      # failure it looks like it can. `cmp /tmp/fapico2.uf2 firmware/fapico2.uf2`
      # asks "does the committed image match this build?" — and a build that
      # bakes in a timestamp or an absolute path answers YES every time,
      # because the committed image was produced by the same non-deterministic
      # build. The staleness gate is therefore blind to exactly the class the
      # ratchet is for.
      #
      # So: build twice, from two different source directories, each with its
      # own target directory, and require the results to be byte-identical.
      # The second source directory is deliberate — a fresh target directory
      # alone would catch a timestamp but not a path, because the source path
      # would be the same in both builds.
      #
      # Measured on this tree before shipping the gate (2026-09-29): four cold
      # builds across two source directories and two target directories all
      # produced 0285ffaa9b2d8712c0b46512bd6482c4ad154af8407717113f351538b4b2d815
      # for the ELF and 77edc4ea935a5ab81099fb561676fe77e863f87da42d26290b0b95c3428b7845
      # for the UF2. The build is reproducible today, so the gate ships
      # enabled. It costs a second full device build in this job; that is the
      # price of knowing the image is a function of the source.
      - name: "Reproducible-build + UF2 staleness + flash-budget ratchet"
        working-directory: fapico2
        run: |
          set -euo pipefail
          ELF=target/thumbv8m.main-none-eabi/release/fapico2-firmware
          REPRO="$RUNNER_TEMP/repro"
          rm -rf "$REPRO"; mkdir -p "$REPRO"
          tar --exclude=./target --exclude=./.git -cf - . | tar -xf - -C "$REPRO"
          ( cd "$REPRO" && CARGO_TARGET_DIR="$REPRO/target" \
              cargo build --release --target thumbv8m.main-none-eabi )
          REPRO_ELF="$REPRO/target/thumbv8m.main-none-eabi/release/fapico2-firmware"
          if ! cmp -s "$ELF" "$REPRO_ELF"; then
            echo "::error::The release build is NOT reproducible — two independent builds of the same tree differ."
            echo "::error::A timestamp, an absolute path, or a hash-ordered iteration has leaked into the image."
            sha256sum "$ELF" "$REPRO_ELF"
            exit 1
          fi
          echo "reproducible-build PASS: two independent builds are byte-identical"
          python3 firmware/uf2gen.py "$ELF" /tmp/fapico2-a.uf2 >/dev/null
          python3 firmware/uf2gen.py "$REPRO_ELF" /tmp/fapico2-b.uf2 >/dev/null
          cmp /tmp/fapico2-a.uf2 /tmp/fapico2-b.uf2
          echo "reproducible-UF2 PASS: both builds produce the same flashable image"
          # The UF2 is a build artifact and is NOT committed — CI produces it
          # here, and build.sh / build-signed.sh do the same locally. There is
          # therefore no committed image to go stale: the artifact under test
          # IS this build. The reproducibility check above is what guarantees
          # the image is a function of the source.
          cp /tmp/fapico2-a.uf2 firmware/fapico2.uf2
          echo "uf2 PASS: shipping image generated from the release build"
          # US-1043, second half: the flash-budget RATCHET on the shipping
          # image. RS-Key's FIRMWARE_FLASH_BUDGET_KIB pattern — a ceiling that
          # is meant to be raised deliberately, with a reason, and never by
          # accident. The shipping image is 3,242 blocks / 1,659,904 B against
          # a 1,664 KiB (1,703,936 B) ceiling: **44,032 B of deliberate
          # headroom**, about eight features at the measured per-feature
          # growth, so this fires on notable growth rather than on every
          # 512-byte block. (It ran at zero headroom until 2026-10-07; see the
          # header above for why that policy changed.) When it does fire, the
          # failure text names the motive, the one command that raises it, and
          # why a reason is required — a red that teaches beats a red that
          # says "you have been told". The 3.5 MiB text ceiling above is the
          # absolute backstop, ~2 MB away.
          BUDGET_KIB=${FIRMWARE_FLASH_BUDGET_KIB:?FIRMWARE_FLASH_BUDGET_KIB is not set}
          BUDGET_BYTES=$(( BUDGET_KIB * 1024 ))
          SHIPPING=$(stat -c %s /tmp/fapico2-a.uf2)
          echo "shipping UF2 = ${SHIPPING} B ($(( SHIPPING / 1024 )) KiB), ratchet ${BUDGET_KIB} KiB"
          {
            echo "### US-1043 flash-budget ratchet (shipping UF2)"
            echo ""
            echo "| image | bytes |"
            echo "|---|---:|"
            echo "| firmware/fapico2.uf2 (shipping) | ${SHIPPING} |"
            echo "| FIRMWARE_FLASH_BUDGET_KIB (ratchet) | $(( BUDGET_BYTES )) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SHIPPING" -gt "$BUDGET_BYTES" ]; then
            {
              echo "::error::the shipping image is ${SHIPPING} B; the ratchet is ${BUDGET_BYTES} B (${BUDGET_KIB} KiB)."
              echo "::error::WHAT THIS MEANS: the firmware image grew past the flash budget this project records as its ceiling."
              echo "::error::WHY THE CEILING EXISTS: it is the only near-term bound on image growth. The 3.5 MiB text ceiling is ~2 MB away and cannot fire on ordinary growth, and the flash map's FIRMWARE_GROWTH_END (2,048 KiB) is the hard limit — past it the image would link over the trussed filesystem holding every OpenPGP and PIV key. A budget nobody raises on purpose is a budget that gets crossed by accident."
              echo "::error::HOW TO FIX IT: python3 tests/scripts/raise_flash_budget.py <new KiB, above ${BUDGET_KIB}> --reason \"why this growth is acceptable\""
              echo "::error::That one command moves every copy of the number (ci.yml, flashmap.rs, board_def.rs, docs/size-report.md, and the mutation harness's anchor) and records your reason beside it. It refuses to raise past FIRMWARE_GROWTH_END or below the shipping image."
              echo "::error::WHY A REASON IS REQUIRED: the number is the layout's argument, not a formality. The next reader must be able to tell whether the growth was reviewed (a feature) or drifted (a dependency bump, an inlined buffer). Six 're-baseline the size report' commits in three weeks were the cost of not having this: each one was unrelated to the change that triggered it."
              echo "::error::OR SHRINK IT: if the growth is not worth 512 bytes of flash, that is the cheaper answer — the ratchet is doing its job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::shipping UF2 ${SHIPPING} B exceeds the ${BUDGET_KIB} KiB (${BUDGET_BYTES} B) ratchet — see the step summary for what it means and how to raise it"
            exit 1
          fi
          echo "flash-budget ratchet PASS: ${SHIPPING} B <= ${BUDGET_BYTES} B"
      - name: Upload flashable UF2 (RP2350)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fapico2-rp2350-uf2
          path: fapico2/firmware/fapico2.uf2

  # ---------------------------------------------------------------------------
  # advertise/serve gate (US-962, wired US-964): the OpenPGP card must not
  # advertise an algorithm group its dispatch does not serve, in BOTH
  # configurations — the production one and the backend-free one. It is two
  # `cargo test` invocations of tests/advertise_serve.rs plus a manifest check.
  #
  # US-964: this job did not exist. The script was referenced by nothing outside
  # its own docstring, so only the default half of it ever ran — by accident,
  # via the host-tests job's `cargo test --workspace` picking up the test — and
  # the half that discriminates (the reduced build) was compiled by nothing.
  # The reviewer proved the consequence: one line in apps/openpgp/Cargo.toml,
  # re-acquiring `fapico2-platform` with default features, kept every signal
  # green while the reduced build carried six backends and advertised four
  # groups. A gate that nothing runs is not a gate.
  # ---------------------------------------------------------------------------
  advertise-serve-gate:
    name: advertise/serve coupling gate (default + reduced)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: Set up Rust (pinned by rust-toolchain.toml)
        working-directory: fapico2
        run: rustup toolchain install --profile minimal --no-self-update
      - name: "Gate: FA advertises exactly what the dispatch serves, in both configurations"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- default build + reduced (no backends) build of tests/advertise_serve.rs ---"
          if ! python3 tests/scripts/check_advertise_serve_coupling.py; then
            echo "::error::The card advertises an algorithm group this build does not serve, or the reduced build it measures does not exist (check the \`default-features = false\` edge on fapico2-platform). US-962/US-964."
            exit 1
          fi
          echo "ok: advertise/serve coupling gate green"

  # ---------------------------------------------------------------------------
  # heap gate (US-383, rewritten US-961): structural proof that the device
  # heap is either absent or EXACTLY the one sanctioned static allocator.
  #
  # US-961: this job was red on the branch. US-938 added the sanctioned
  # allocator (platform/src/rsa_heap.rs — a 48 KiB linked_list_allocator
  # LockedHeap behind the software-RSA backend, right-sized from measurement
  # by US-956/US-957) and the US-383 grep had never been re-run, because CI
  # had never run on this branch. The grep was not weakened and the allocator
  # was not deleted: it was replaced by tests/scripts/check_heap_gate.py,
  # which states the exemption precisely — exactly one `#[global_allocator]`
  # in device source, it is the sanctioned one, and it is a LockedHeap over a
  # fixed-size static; the device firmware is still #![no_std]; the heap is
  # actually linked into the release image; and nothing may allocate before
  # rsa_heap::init() goes live (the pre-boot invariant, which a linked
  # allocator turns from "impossible" into "a dark boot"). A second,
  # unsanctioned heap still fails, as does deleting the sanctioned one.
  # ---------------------------------------------------------------------------
  no-heap:
    name: heap gate (one sanctioned allocator, nothing allocates pre-boot)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: "Heap gate: one sanctioned allocator + pre-boot allocation invariant"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- exactly one sanctioned #[global_allocator]; #![no_std] device firmware; pre-boot ordering ---"
          if ! python3 tests/scripts/check_heap_gate.py; then
            echo "::error::Heap gate failed — device source must be heap-free except for platform/src/rsa_heap.rs, and nothing may allocate before rsa_heap::init()."
            exit 1
          fi
          echo "ok: heap gate green"

  # ---------------------------------------------------------------------------
  # persist gate (US-429): structural proof that the one-persist-implementation
  # invariant (plan Global Constraint #3) holds. A comment-aware grep over every
  # Rust source (the two platform persist files exempt) for the deleted
  # pre-split snapshot/program names (snapshot_secure_partition /
  # persist_secure_partition / persist_partition_image). A code-level
  # occurrence means a transport re-sequenced persistence instead of going
  # through platform/src/persist.rs. Mirrors the no-heap gate style
  # (checkout -> run the standalone gate script -> fail on non-zero).
  # ---------------------------------------------------------------------------
  persist-gate:
    name: persist gate (one implementation)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: "Grep: one persist implementation (no code-level snapshot/program re-sequence)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- scanning all *.rs for the deleted pre-split persist names (comment-aware) ---"
          if ! python3 tests/scripts/check_persist_gate.py; then
            echo "::error::A code-level snapshot_/persist_secure_partition/persist_partition_image occurrence — a transport re-sequenced persistence instead of using platform/src/persist.rs."
            exit 1
          fi
          echo "ok: one-persist-implementation gate green"

  # ---------------------------------------------------------------------------
  # Attestation gate (US-916): structural proof that the per-device
  # attestation identity provisioning holds. A comment-aware scan asserting
  # (a) the repo-committed attestation blobs (attestation_key.bin /
  # attestation_cert.der) never reappear anywhere in the tree and (b) no
  # code-level include_bytes! returns to apps/fido/src/attestation.rs — the
  # identity is minted on device from the TRNG at first boot and persisted
  # through the secure store, never shipped. Same gate style as the persist
  # gate above (checkout -> run the standalone gate script -> fail on
  # non-zero).
  # ---------------------------------------------------------------------------
  attestation-gate:
    name: attestation gate (per-device provisioning)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: "Grep: no repo-committed attestation material (blobs gone, no include_bytes!)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- scanning the tree for the deleted attestation blobs / include_bytes! (comment-aware) ---"
          if ! python3 tests/scripts/check_attestation_gate.py; then
            echo "::error::Repo-committed attestation material reappeared — the attestation identity is minted on device (US-916); delete the blob / include_bytes!."
            exit 1
          fi
          echo "ok: attestation-provisioning gate green"

  # ---------------------------------------------------------------------------
  # One-randomness-path gate (US-1005, RS-KEY-ADOPT Phase 1): a comment-aware
  # scan asserting that no transport outside platform/src/trng.rs names a raw
  # peripheral draw (blocking_fill_bytes / EmbTrng::new / Trng::new). Every
  # nonce comes from platform::trng::DrbgTrng; the allowlist is the handful of
  # bootstrap draws, each carrying a stated reason, and the script prints those
  # reasons on every run so an unexplained entry is visible rather than
  # silently permitted. Same gate style as the two above.
  # ---------------------------------------------------------------------------
  rng-path-gate:
    name: rng path gate (every nonce via the DRBG)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: "Grep: no code-level peripheral draw outside platform/src/trng.rs"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- scanning for raw TRNG draws that bypass the DRBG (comment-aware) ---"
          if ! python3 tests/scripts/check_rng_path.py; then
            echo "::error::A code-level blocking_fill_bytes / EmbTrng::new / Trng::new outside the allowlist — a caller is drawing from the peripheral instead of the DRBG. Take bytes from platform::trng::DrbgTrng."
            exit 1
          fi
          echo "ok: one-randomness-path gate green"

  # ---------------------------------------------------------------------------
  # Flash-erase budget gate (US-1010, RS-KEY-ADOPT Phase 2): a doc-agreement
  # gate in the check_size_report.py style, but over a MEASUREMENT rather than
  # a rebuilt ELF. It runs the host instrument in
  # platform/tests/persist_sink.rs (the real FlashSlotSink over a NOR model, at
  # the shipping slot geometry) and fails while docs/erase-budget.md disagrees
  # with it. The instrument's unchanged-image control is what makes this a
  # measurement of the code and not of the prose: a sink that lost its
  # compare-then-write reports a non-zero erase count there and this goes red.
  # ---------------------------------------------------------------------------
  erase-budget-gate:
    name: erase budget gate (docs/erase-budget.md matches the measurement)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: "Measure: erases per persist, and gate docs/erase-budget.md on it"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- measuring the sink's erase budget and comparing it with the document ---"
          if ! python3 tests/scripts/check_erase_budget.py; then
            echo "::error::The flash erase budget has drifted from what FlashSlotSink::program actually does. Re-run the instrument (cargo test -p fapico2-platform --target x86_64-unknown-linux-gnu --test persist_sink erase_budget_figures -- --exact --nocapture) and update docs/erase-budget.md."
            exit 1
          fi
          echo "ok: erase-budget gate green"

  # ---------------------------------------------------------------------------
  # Assurance gates (US-1042, RS-KEY-ADOPT Phase 5): the rest of the gate set,
  # unconditionally.
  #
  # The skeptic pass this story comes from found a repository whose check job
  # was gated on `docs_only != 'true'`, where GitHub counts a SKIPPED required
  # check as SATISFIED — so a docs-only pull request merged with no assurance
  # signal at all and nothing red. fapico2 never wrote that condition. What it
  # had was the quieter form of the same risk, and this job is the fix: seven
  # of the seventeen gate scripts were referenced by NO workflow at all, so a
  # docs-only change skipped them — and so did every other change. A gate that
  # nothing runs is not a gate (US-964's finding, restated).
  #
  # There is deliberately NO `if:` on this job or on its step, and no
  # `paths:`/`paths-ignore:` on the workflow. Any future attempt to add one is
  # caught by tests/scripts/test_gates.py, which parses this file, evaluates
  # every job's and step's `if:` for a docs-only change set, and requires all
  # seventeen (bar the one declared container-scoped exclusion it prints) to be
  # invoked by a step that would actually run. It refuses to guess: a
  # condition it cannot evaluate is an error, not a pass.
  #
  # The gates that need a device build or a cargo test are not repeated here —
  # check_size_report / check_async_frame / check_boot_chain are in the
  # device-build job, and the advertise/serve, heap, persist, attestation,
  # erase-budget and rng-path gates each have their own job above. What is here
  # is the set that had no job at all.
  # ---------------------------------------------------------------------------
  gates:
    name: assurance gates (structural, no device build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      # No Rust toolchain here, and that is deliberate: every script in the loop
      # below is plain python3 over files in the checkout. This step used to
      # install stable, which cost ~30s of toolchain download per push for a
      # job that never invoked cargo. (advertise-serve-gate DOES need Rust —
      # its script shells out to cargo to measure the reduced build — so the
      # toolchain stays there.)
      - name: "Gates: the remaining gate scripts, unconditionally"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- structural gates with no workflow of their own (US-1042) ---"
          # US-1534: check_flash_budget.py joins this list rather than
          # check_size_report.py's step on purpose. It parses two text files,
          # so it can run here and fail a pull request in seconds; inside the
          # device-build job it would run only after a full release build of
          # the ELF, which is minutes per raise of the budget.
          #
          # 2026-10-07: check_acceptance_exit_code.py and
          # check_foreign_image_wipe.py join it for the reason this job exists.
          # Both were invoked by NOTHING that runs in CI — the first only by
          # `run_tests.sh`'s full local mode, the second by no workflow at all
          # — and `test_gates.py --workflows-only` (the step below) named them
          # the moment it was wired in. Both are plain python3 over the
          # checkout (measured: 0.07 s and 3.2 s), so they belong here rather
          # than behind a device build.
          rc=0
          for g in \
            tests/scripts/check_flash_budget.py \
            tests/scripts/check_acceptance_exit_code.py \
            tests/scripts/check_boot_clock_order.py \
            tests/scripts/check_dbg_release_gate.py \
            tests/scripts/check_debug_strip.py \
            tests/scripts/check_foreign_image_wipe.py \
            tests/scripts/check_otp_provisioning_precondition.py \
            tests/scripts/check_picoforge_compat_docs.py \
            tests/scripts/check_readme.py \
            tests/scripts/check_release_notes.py \
            tests/scripts/check_us413_feasibility.py
          do
            echo "== $g"
            if ! python3 "$g"; then
              echo "::error::${g} is red (see the output above)."
              rc=1
            fi
          done
          exit $rc
      # 2026-10-07: the harness that proves every gate above BITES is now run
      # where its fast half can run unconditionally. `--workflows-only` is the
      # structural half — it parses these workflow files, simulates a docs-only
      # change, and asserts (a) every gate script is invoked by a step that
      # would run, (b) the US-1043 ratchet is wired and unconditional, and
      # (c) the US-1010 RAM ceiling is derived from board SRAM minus the stack
      # chain ceiling and still bites. It needs no toolchain (it reads
      # platform/board_def.rs rather than the generated memory.x for exactly
      # that reason) and takes about a second.
      #
      # The full mutation half — every gate run twice on a copy, once with a
      # nominated defect — pays cold device builds, so it runs on the path-
      # filtered push job in `gates-mutation.yml` instead of on every PR. What
      # must never happen again is the state this step ends: a harness that
      # nothing ran, quietly holding two anchors that had rotted.
      - name: "Gate falsifiability: the wiring half of tests/scripts/test_gates.py"
        working-directory: fapico2
        run: python3 tests/scripts/test_gates.py --workflows-only

  # ---------------------------------------------------------------------------
  # Supply-chain provenance (US-1060, RS-KEY-ADOPT Phase 7). Two halves, and
  # the split is the point:
  #
  #   cargo-deny reads the RESOLVED THIRD-PARTY graph — sources, licences,
  #   advisories, duplicated versions, and the named `wrappers` allowlist.
  #   `--deny unused-wrapper --deny unmatched-skip` is what makes the
  #   allowlists non-rotting: an entry that no longer matches a real edge is
  #   an error, not a comment (verified on cargo-deny 0.20.2:
  #   `error[unused-wrapper]: wrapper for banned crate was not encountered`).
  #
  #   check_crate_graph.py reads the WORKSPACE'S OWN edges — the rules
  #   cargo-deny has no setting for, in any version. It is the half that
  #   cannot be delegated, and the half the epic's US-1060 red is aimed at
  #   (an injected applet->applet edge must turn it red).
  #
  # Unconditional, like every other gate job: a check GitHub can mark as
  # SKIPPED on a docs-only change set is not a check (US-1042).
  #
  # The action is pinned to a full commit SHA. The rest of this workflow uses
  # moving tags (`actions/checkout@v4` and friends), which is a divergence
  # from RS-Key's "all CI actions pinned" property recorded in
  # docs/supply-chain.md — the new jobs do the right thing and the old ones
  # are left alone rather than being rewritten inside a CI story.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: supply chain (deny.toml graph assertions)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: Set up Rust (pinned by rust-toolchain.toml)
        working-directory: fapico2
        run: rustup toolchain install --profile minimal --no-self-update
      - name: cargo-deny — the resolved third-party graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: fapico2/Cargo.toml
          command: check
          args: >-
            --deny unused-wrapper
            --deny unmatched-skip
      - name: "Gate: the workspace's own crate edges (R1/R2/G4/G5)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- applet isolation edges, backend ownership, wildcards, duplicate set ---"
          if ! python3 tests/scripts/check_crate_graph.py; then
            echo "::error::A crate-graph assertion failed — an applet->applet edge, a backend named outside platform, a wildcard version requirement, or a duplicated crate that changed without a decision. See the output above (US-1060)."
            exit 1
          fi
          echo "ok: crate-graph assertions green"
      # US-1061: cargo-vet. Installed from source with --locked rather than
      # through a third-party installer action, so this job depends on no
      # action outside the two it already names.
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: "Gate: vet coverage, exemption reasons, and the documented counts"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- cargo-vet, stated reasons for every exemption, derived counts ---"
          if ! python3 tests/scripts/check_supply_chain.py; then
            echo "::error::Supply-chain audit failed — an unvetted dependency, an exemption with no stated reason, or docs/supply-chain.md disagreeing with the locked graph. See the output above (US-1061)."
            exit 1
          fi
          echo "ok: supply-chain audit green"
      # US-1062: the committed CycloneDX SBOM, cross-checked both ways against
      # the locked graph. No tool is needed to RUN this step — cargo-cyclonedx
      # is what PRODUCES the SBOM, and regeneration is a deliberate act
      # (regenerate-sbom in the gate's own failure message), not something a
      # push should do silently on the author's behalf.
      - name: "Gate: the SBOM matches the locked graph, in both directions"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- CycloneDX component set vs the fapico2-firmware closure ---"
          if ! python3 tests/scripts/check_sbom.py; then
            echo "::error::The SBOM and the locked graph disagree — a component the build does not contain, or a dependency the SBOM omits (US-1062)."
            exit 1
          fi
          echo "ok: SBOM green"
      # US-1063/US-1064: the provenance POLICY and the artefact-AGREEMENT
      # logic, exercised on every push against committed fixtures with
      # negative controls. The parts that need GitHub's OIDC issuer (the
      # cosign step, the attestation step) live in .github/workflows/
      # release.yml and have never run — see the header of that file. What
      # runs here is the decision logic those steps feed, through the same
      # functions, so a change that stops the policy refusing a release
      # built outside the reusable workflow is red on the next push rather
      # than at the next release.
      - name: "Gate: provenance policy and artefact agreement (fixtures)"
        working-directory: fapico2
        run: |
          set -uo pipefail
          echo "--- job_workflow_ref / subject-digest policy, then UF2<->SBOM<->attestation ---"
          if ! python3 tests/scripts/check_release_provenance.py; then
            echo "::error::The provenance policy no longer behaves as specified against its own controls (US-1063)."
            exit 1
          fi
          if ! python3 tests/scripts/check_artefact_agreement.py; then
            echo "::error::The artefact-agreement gate no longer refuses a UF2 that was changed after signing, or no longer accepts the consistent case (US-1064)."
            exit 1
          fi
          echo "ok: release provenance + artefact agreement green"

  # ---------------------------------------------------------------------------
  # FUZZING IS NOT HERE ANY MORE. It was: a 15-minute smoke per target on
  # every push, nine targets in a matrix. Measured over 2026-09-25..10-02 that
  # was 3,842 job-minutes — 85% of every minute this repository spent in
  # Actions — and fuzz/README.md describes it in its own words as
  #
  #   "a *regression* net, not a *discovery* engine ... Deeper runs are
  #    intended to be scheduled (e.g. nightly)"
  #
  # while no scheduled workflow existed at all. The discovery engine was never
  # built, so the regression smoke was doing discovery work on every push, at a
  # wall-clock budget too short to grow coverage across runs anyway.
  #
  # It now lives in .github/workflows/fuzz-nightly.yml: all nine targets, the
  # same 15-minute per-target budget, nightly at 03:17 UTC, plus
  # workflow_dispatch and a paths-filtered push trigger for the "I am touching
  # a parser right now" case. No target was dropped and no budget shortened;
  # crash reproducers are uploaded as artefacts so a finding survives the
  # runner.
  #
  # Nothing else was cut. The gates below are the security posture and they are
  # untouched: supply chain, device integration, attestation, assurance, rng
  # path, heap, persist, erase budget.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 4/4 — the pytest gate (Phase 3 exit config).
  #
  #      fapico2's OWN suites, in this repository: tests/pico-fido (HID/CTAP2),
  #      tests/piv (CCID), tests/openpgp (CCID), tests/harness (relay, restart,
  #      red-team). They run against the one Rust emulation binary, built once.
  #
  #      This job used to check out a sibling repository, `pico-fido2`, for its
  #      suites, and guard every step on `hashFiles('pico-fido2/…')`. That
  #      repository was never published, so the checkout failed behind
  #      `continue-on-error`, `hashFiles` returned '', every step was skipped, and
  #      the job reported success having executed nothing — for every push since
  #      the initial release. A separate `phase3-gate.yml` duplicated the same
  #      arrangement with the `repository:` key missing from its checkout
  #      entirely, so it re-checked fapico2 into the `pico-fido2/` path and
  #      skipped for the same reason. Both are gone.
  #
  #      There is now no second checkout and no conditional step in this job: the
  #      suites and tests/requirements.txt are in the tree that is checked out,
  #      so a step here cannot vanish. The `if:` guards were not a safety
  #      measure; they were the failure mode.
  #
  #      BLOCKING. Every suite in tests/ is green as of this commit, and the
  #      known-red PIV stories (US-374/375) are `xfail(strict=False)` inside
  #      tests/piv — they run and report, and they do not make the job red.
  #
  #      `--suites-only` because clippy, `cargo test` and the gate scripts each
  #      already have their own job in this workflow; see run_tests.sh.
  # ---------------------------------------------------------------------------
  pytest-gate:
    name: pytest gate (fapico2 emulator suites)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fapico2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fapico2
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # pyscard builds its C extension against the PC/SC headers, and
      # tests/pico-fido/utils.py imports the smartcard package unconditionally.
      - name: Install PC/SC headers (pyscard build dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Set up Rust (pinned; host target for the emulator)
        working-directory: fapico2
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Install Python test dependencies
        run: |
          python -m venv .test-venv
          ./.test-venv/bin/pip install --upgrade pip
          ./.test-venv/bin/pip install -r fapico2/tests/requirements.txt
      - name: "GATE: the emulator suites (pico-fido, piv, openpgp, harness)"
        working-directory: fapico2
        env:
          # run_tests.sh takes the pytest interpreter from this variable, so CI's
          # own venv is used rather than any path that happens to exist locally.
          PICO_FIDO2_VENV: ${{ github.workspace }}/.test-venv/bin/python
        run: ./run_tests.sh --suites-only
      - name: Archive emulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-gate-emulator-logs
          path: |
            /tmp/fapico2_relay.log
            fapico2/tests/harness/
